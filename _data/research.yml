- title: Correcting hallucinations in generated text
  text: >-
    Language models often write paragraphs that mix correct and incorrect
    statements. I developed REVISE, which splits a paragraph into individual
    claims, checks each claim against retrieved evidence, and rewrites only
    the claims that are not supported. I also study how to detect these errors
    with an ensemble of checkers and in settings with limited computing
    resources.
  papers: [AITest 2025, DISTILL 2025, CCNC 2026]

- title: Faithful image captions for safety-critical scenes
  text: >-
    When a vision-language model shortens a caption, it can drop details that
    matter for safety, such as a pedestrian or a traffic signal. MS-CAPS uses
    a knowledge graph to compress captions of traffic scenes, and evaluates
    each caption by how well an image generator can reconstruct the original
    scene from it.
  papers: [EACL 2027]

- title: Hallucinations in clinical speech
  text: >-
    Audio-language models are used to write clinical notes from
    doctor–patient conversations. I study how errors in listening, such as a
    misheard drug name, turn into false statements in the final note, and I am
    building a benchmark to measure these errors against the original audio.
  papers: []

- title: Adversarial testing of language models
  text: >-
    I measure how small changes to a prompt increase the rate of
    hallucination in open language models, so that detection and correction
    methods can be tested under realistic pressure.
  papers: [MobiSecServ 2024]
