- title: Faithful image captions for safety-critical traffic scenes (MS-CAPS)
  dates: 2025 – present
  text: >-
    When a vision-language model shortens a caption, it can drop details that
    matter for safety, such as a pedestrian or a traffic signal. MS-CAPS uses a
    knowledge graph to shorten traffic-scene captions to a minimal sufficient
    form, and checks each caption by asking an image generator (FLUX.1-dev) to
    rebuild the scene from it.
  results:
    - Evaluated on 150 real-world scenes from Vehicle-centric, CoDA-LM, and NuInteract with Qwen2.5-VL, GPT-4o, and Gemini.
    - Up to 98% of outputs accepted (49 of 50 scenes) with 62.5% average caption reduction.
  papers: [EACL 2027]

- title: Disaster damage summaries from satellite images
  dates: 2026
  text: >-
    After a disaster, responders need short, correct reports of what was
    damaged and where. I study how vision-language models read before-and-after
    satellite images, and which damage representations help them report damage
    type, location, and building counts without making things up.
  results:
    - Built question-answer data from xBD building-damage labels.
  papers: [ICNC 2027]

- title: Hallucinations in clinical speech
  dates: 2025 – present
  text: >-
    AI systems that write clinical notes from doctor–patient conversations can
    turn a listening mistake, such as a misheard drug name, into a false
    statement in the note. I compare speech-to-text-then-LLM systems with
    models that listen to audio directly, and trace where each error starts.
  results:
    - Evaluation pipeline on 57 doctor–patient consultations (PriMock57).
    - Pilot runs showed about 75% hallucination and 80% topic-mismatch rates, motivating stage-by-stage error tracing.
  papers: []

- title: Correcting hallucinations in generated text (REVISE)
  dates: 2024 – present
  text: >-
    Language models often write paragraphs that mix correct and incorrect
    statements. REVISE splits a paragraph into individual claims, checks each
    claim against retrieved evidence, and rewrites only the claims that are not
    supported, keeping the rest of the paragraph the same.
  results:
    - Evaluated on 1,400+ passages from Natural Questions and SQuAD.
    - Up to 76.8% factual accuracy on the NQ-Mis benchmark.
  papers: [AITest 2025, DISTILL 2025, CCNC 2026]

- title: Adversarial testing of language models
  dates: 2024
  text: >-
    I measure how small changes to a prompt increase hallucination in open
    language models, so that detection and correction methods can be tested
    under realistic pressure.
  results:
    - Attacks on Vicuna-7B and LLaMA-2-7B-chat succeeded up to 92.53% of the time.
  papers: [MobiSecServ 2024]

